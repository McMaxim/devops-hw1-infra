[defaults]
inventory = inventory.ini
roles_path = roles
retry_files_enabled = False
interpreter_python = auto_silent
# handlers выполняются, даже если плей упал на середине — иначе изменённый конфиг
# (например, sshd) так и не будет применён: на следующем прогоне задача уже ok и не уведомит handler
force_handlers = True

[ssh_connection]
pipelining = True
