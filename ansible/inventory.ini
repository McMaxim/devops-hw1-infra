# IP VM, которую создаёт scripts/bootstrap_vm.sh (OrbStack Linux machine, Ubuntu 22.04)
[app_hosts]
devops-vm ansible_host=192.168.139.194

[app_hosts:vars]
# Начальный админ, созданный bootstrap'ом (аналог `ubuntu` в облачных образах)
ansible_user=ubuntu
ansible_ssh_private_key_file=~/.ssh/devops_hw_ed25519
