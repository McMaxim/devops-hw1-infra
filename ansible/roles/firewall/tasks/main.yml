---
# Аналог Security Group. Важно: порты, опубликованные Docker'ом, обходят ufw
# (Docker пишет свои правила в iptables раньше ufw), поэтому наружу публикуем
# только то, что действительно нужно — 80 и 8080.
- name: Установить ufw
  ansible.builtin.apt:
    name: ufw
    state: present

# Сначала разрешаем SSH, потом включаем deny по умолчанию — иначе отрежем себе доступ
- name: Разрешить SSH только из доверенных сетей
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp
    from_ip: "{{ item }}"
    comment: ssh-admin
  loop: "{{ firewall_ssh_allowed_from }}"

- name: Открыть порты приложений
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop: "{{ firewall_open_ports }}"

- name: Запретить остальной входящий трафик и включить ufw
  community.general.ufw:
    state: enabled
    policy: deny
    direction: incoming
